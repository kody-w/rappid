name: RAPP Zoo v2

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  protocol-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run test:rapp1
      - run: npm run test:licenses
      - run: npm run test:unit
      - run: npm run test:mutations

  real-electron:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:e2e
